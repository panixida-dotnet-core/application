name: Coverage diagnostics

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dotnet-coverage-sonarqube
          path: coverage
          run-id: 44556113040
          github-token: ${{ github.token }}
      - name: List uncovered lines
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage/SonarQube.xml").getroot()
          for file in root.findall("file"):
              missing = [
                  line.attrib["lineNumber"]
                  for line in file.findall("lineToCover")
                  if line.attrib.get("covered") == "false"
              ]
              if missing:
                  print(file.attrib["path"], "uncovered lines:", ", ".join(missing))
          PY
